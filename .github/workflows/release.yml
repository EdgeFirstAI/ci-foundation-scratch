# Proof caller — dry-run only. Pin uses: and shared-sha to the same commit.

name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    uses: EdgeFirstAI/.github/.github/workflows/release-rust.yml@2c47ac832e402d573aba404df1013a6b2876dc46
    with:
      dry-run: true
      publish-crates: false
      build-wheels: false
      shared-sha: 2c47ac832e402d573aba404df1013a6b2876dc46
    secrets: inherit
